[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "teuxdeux"
version = "0.1.0"
description = "Unofficial TeuxDeux REST client (httpx + pydantic)"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Nam Tonthat" }]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
teuxdeux = "teuxdeux.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/teuxdeux"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["live: hits the real TeuxDeux API (needs TEUXDEUX_EMAIL/PASSWORD; opt-in)"]

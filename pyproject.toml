[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "teuxdeux"
version = "0.1.0"
description = "Unofficial TeuxDeux REST client (httpx + dataclasses)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Nam Tonthat" }]
keywords = ["teuxdeux", "todo", "cli", "api-client"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.urls]
Repository = "https://github.com/namtonthat/teuxdeux"
Documentation = "https://github.com/namtonthat/teuxdeux#readme"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
teuxdeux = "teuxdeux.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/teuxdeux"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["live: hits the real TeuxDeux API (needs TEUXDEUX_USERNAME/PASSWORD; opt-in)"]
